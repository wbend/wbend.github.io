<!DOCTYPE html>
<html>
	<head>
		<title>GG Detector</title>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="{{ url_for('static', filename='jquery-ui-1.12.1/jquery-ui.min.css') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='jquery-ui.min.css') }}">
		<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
		<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
		<script>

		// Check authentication on page load
		if (sessionStorage.getItem('gg_authenticated') !== 'true') {
			window.location.href = '/login';
		}

		$( function() {
		$("#end").datepicker({
	    dateFormat: 'mm/dd/yy',// format to give to the python script
	    changeMonth: true,// allow changing the month in a drop down list
	    changeYear: true,// allow changing the year in a drop down list
	    minDate : (new Date(2006, 9, 10)), //to only allow search of only when VK started 
		maxDate: (new Date()),// get today's date
		defaultDate: new Date()
	    }).datepicker("setDate", new Date());// set the selected date to the current date
		});

		$( function() {
		$("#start").datepicker({
		    dateFormat: 'mm/dd/yy',// format to give to the python script
		    changeMonth: true,// allow changing the month in a drop down list
		    changeYear: true,// allow changing the year in a drop down list
		    minDate : (new Date(2006, 9, 10)), //to only allow search of only when VK started 
			maxDate: (new Date()),// get today's date
			defaultDate: new Date(),
			onSelect: function(date) {//if the user selected a start date, only allow the end date to be larger
            	$("#end").datepicker("option","minDate",
     			$("#start").datepicker("getDate"));
        		}
		    }).datepicker("setDate", new Date());// set the selected date to the current date
	});
		</script>

	</head>
	<body class="main-body">
		<!--If the result.html was called and there was an error in the paramters the input provided, print an ERROR message -->
		{% if ERROR is defined%}
			<script>
				var someJavaScriptVar = {{ ERROR|tojson }};
				alert(someJavaScriptVar)
			</script>

	    {% endif %}


		<div class="container">
			<h1> GG Detector </h1>
			<div class="logout-container">
				<button id="logoutBtn" class="logout-btn">🚪 Logout</button>
			</div>
		</div>	

		<div class="instructions">
			


		</div>
		<div class="inputContainer">
			<form action = "" method = "POST" class= "inputForm" id="inForm">
				<table class="inputTable">
					<tr class="inputFields">
						<td class="inputFields">
							<label> Latitude: </label>
						</td>
						<td class="inputFields">
							<input id="latt" type = "text" name = "lat" readonly />
						</td>	
					</tr>
					
					<tr class="inputFields">
						<td class="inputFields">
							<label> Longitude: </label>
						</td>
						<td class="inputFields">
							<input id="long" type = "text" name = "lon" readonly />
						</td>	
					</tr>
					<tr class="inputFields">
						<td class="inputFields" >
							<label> Radius in meters: </label>
						</td>	
						<td class="inputFields">
							<select id="radiusSize" name="rad">
								<option value="100"> 100 </option>
								<option value="800"> 800 </option>
								<option value="2000"> 2000 </option>
								<option value="6000"> 6000 </option>
								<option value="50000"> 50000 </option>
							</select>
						</td>	
					</tr>
					<tr class="inputFields">				
						<td class="inputFields">
							<label> Start Date: </label>
						</td>	
						<td class="inputFields">
							<input type="text" readonly='true' class="datepicker" id="start" name="start">
						</td>	
					</tr>
					<tr class="inputFields">
						<td class="inputFields">
							<label> End Date: </label>
						</td>
						<td class="inputFields">
							<input type="text" readonly='true' class="datepicker" id="end" name="end">
						</td>	
					</tr>
					<tr class="inputFields">
						<td class="inputFields">
							<label>Maximum number of posts to be listed (0 to show all public posts):</label>
						</td>
						<td class="inputFields">
							<input type="number" min="0" value="0" id="numebrOfPosts">
						</td>	
					</tr>
				</table>
				<div class="submit-div">
				 <input id="submit-button" type="submit" name="submit" value="submit">
				</div>

			</form>
			<div class="test">
   				<input id="pac-input" class="controls" type="text" placeholder="Search Box">

				 <div id="map">
					    <script src="{{ url_for('static', filename='MapScript.js') }}"> </script>
					    <!-- here google maps need an API key -->
					    <script async defer
					    src={{googleMap}}>
					    </script>

				  </div>
			</div>
			 
		</div>

		<script>
			// Logout functionality
			document.getElementById('logoutBtn').addEventListener('click', function() {
				sessionStorage.removeItem('gg_authenticated');
				window.location.href = '/login';
			});
		</script>

	</body>

</html>
