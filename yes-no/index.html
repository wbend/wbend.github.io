<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Yes or No</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button {
      flex: 1;
      width: 100%;
      border: none;
      cursor: pointer;
      font-size: 20vw;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: white;
      transition: filter 0.1s;
      outline: none;
      position: relative;
    }

    button:active {
      filter: brightness(0.8);
    }

    .yes {
      background: #22c55e;
    }

    .no {
      background: #ef4444;
    }

    @media (min-width: 600px) {
      body { flex-direction: row; }
      button { font-size: 10vw; }
    }
  </style>
</head>
<body>
  <button class="yes" id="yesBtn">YES</button>
  <button class="no" id="noBtn">NO</button>

  <script>
    const yesAudio = new Audio('Yes.mp4');
    const noAudio = new Audio('No.mp4');

    function play(audio) {
      audio.currentTime = 0;
      audio.play();
    }

    document.getElementById('yesBtn').addEventListener('click', () => play(yesAudio));
    document.getElementById('noBtn').addEventListener('click', () => play(noAudio));
  </script>
</body>
</html>
